<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>3Draft Viewer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600&family=DM+Mono:wght@400;500&display=swap">
  <style>
    /* Layout: one-screen instrument. Slim title bar, one square drawing stage, readout bar below. */
    :root {
      --bg: #f3f4f1;
      --panel: #fbfbf9;
      --fg: #1c1f1d;
      --muted: #656b66;
      --line: #d3d7d0;
      --edge: #1d1d1f;
      --point: #d6336c;
      --cursor: #0b7285;
      --accent: #c2255c;
      --font-display: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
      --font-mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #141614;
        --panel: #1b1e1b;
        --fg: #e8eae5;
        --muted: #9aa19a;
        --line: #2f342f;
        --edge: #efe9df;
        --point: #ff6b9a;
        --cursor: #3bc9db;
        --accent: #ff7aa6;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #141614;
      --panel: #1b1e1b;
      --fg: #e8eae5;
      --muted: #9aa19a;
      --line: #2f342f;
      --edge: #efe9df;
      --point: #ff6b9a;
      --cursor: #3bc9db;
      --accent: #ff7aa6;
      color-scheme: dark;
    }

    html, body { height: 100%; }
    body {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0;
      padding-block: 12px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.4 var(--font-mono);
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px 20px;
    }
    h1 {
      margin: 0;
      font: 600 22px/1 var(--font-display);
      letter-spacing: 0.02em;
    }
    h1 span {
      margin-left: 8px;
      font: 400 12px/1 var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .build, .hint, .read { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
    .read { display: flex; flex-wrap: wrap; gap: 6px 20px; }
    .read b { display: inline-block; min-width: 4ch; font-weight: 500; color: var(--fg); }
    .read .surface { min-width: 34ch; }
    .read .surface b { min-width: 0; }
    .actions { display: flex; gap: 8px; }

    #stage {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #stage.drag { cursor: grabbing; }
    /* H: faces only, no edges and no points */
    #stage.clean svg polygon { stroke: none; }
    #stage.clean svg circle { display: none; }
    #stage, #stage:focus, #stage:focus-visible { outline: none; }
    #frame { position: relative; }
    #frame canvas { display: block; }
    #frame canvas[hidden] { display: none; }
    #layer { position: absolute; inset: 0; }
    #layer:not(.over) { position: static; }
    #stage svg { display: block; max-width: 100%; }
    /* WebGPU mode: the SVG is only the cross on top of the canvas */
    #stage.gpu #layer { pointer-events: none; }
    #stage.gpu svg rect, #stage.gpu svg text { display: none; }
    /* the renderer writes light-theme colors as attributes; the tokens win in either theme */
    #stage svg rect { fill: var(--panel); stroke: var(--line); }
    #stage svg text { fill: var(--muted); font-family: var(--font-mono); }
    #stage svg polygon { stroke: var(--edge); }
    #stage svg circle { fill: var(--point); }
    #stage svg polyline { stroke: var(--cursor); }

    button {
      font: 500 13px/1 var(--font-mono);
      color: var(--fg);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px 14px;
      cursor: pointer;
    }
    button:hover { border-color: var(--muted); }
    button:focus, button:focus-visible { outline: none; }

    /* Phones and tablets: the stage fills the screen, no text, four round translucent buttons. */
    .fab { display: none; }
    @media (pointer: coarse), (max-width: 640px) {
      body { padding: 0; gap: 0; overflow: hidden; }
      header.bar, footer.bar { display: none; }
      #stage { position: fixed; inset: 0; background: var(--panel); }
      #stage svg rect, #stage svg text { display: none; }
      .fab {
        position: fixed;
        left: 0;
        right: 0;
        bottom: max(18px, env(safe-area-inset-bottom, 0px));
        display: flex;
        justify-content: center;
        gap: 16px;
        pointer-events: none;
      }
      .fab button {
        pointer-events: auto;
        width: 56px;
        height: 56px;
        padding: 0;
        border: 1px solid color-mix(in srgb, var(--fg) 22%, transparent);
        border-radius: 50%;
        background: color-mix(in srgb, var(--panel) 55%, transparent);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        color: var(--fg);
        display: grid;
        place-items: center;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .fab button:active, .fab button.on { background: color-mix(in srgb, var(--accent) 35%, transparent); }
      .fab svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <h1>3Draft<span>viewer</span></h1>
    <p class="build" id="build" title="Build, YY.MM.DD.NNN">–</p>
  </header>

  <main id="stage" tabindex="0" role="img" aria-label="Empty space for prisms. G switches between the SVG and the WebGPU view, L turns the light. Drag, or use the arrow keys, to rotate the view. The cross follows the surface under the pointer. Space puts a prism down there, or shoots one into empty space. D deletes the prism under the cross, T flies the camera to the object under the cross, H toggles edges and points, Backspace takes the last one back."><div id="frame"><canvas id="gpu" hidden></canvas><div id="layer"></div></div></main>

  <div class="fab" aria-label="Controls">
    <button id="fabTravel" type="button" aria-label="Travel to the object under the cross (T)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <button id="fabPlace" type="button" aria-label="Place or shoot a prism (Space)"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"/></svg></button>
    <button id="fabDelete" type="button" aria-label="Delete the prism under the cross (D)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <button id="fabMode" type="button" aria-label="Switch SVG / WebGPU view (G)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg></button>
  </div>

  <footer class="bar">
    <p class="read">
      <span>yaw <b id="yaw">–</b></span>
      <span>pitch <b id="pitch">–</b></span>
      <span>placed <b id="count">0</b></span>
      <span>view <b id="mode">svg</b></span>
      <span>live <b id="live" title="MCP link">off</b></span>
      <span class="surface" id="surface">surface <b>–</b></span>
    </p>
    <p class="hint">drag: rotate · space: place · d: delete · t: travel · h: edges · g: svg/gpu · l: light · backspace: undo</p>
    <span class="actions">
      <button id="place" type="button">Place</button>
      <button id="delete" type="button">Delete</button>
      <button id="travel" type="button">Travel</button>
      <button id="lines" type="button">Edges</button>
      <button id="gpuBtn" type="button">WebGPU</button>
      <button id="light" type="button">Light</button>
      <button id="undo" type="button">Undo</button>
      <button id="reset" type="button">Reset view</button>
    </span>
  </footer>

  <script type="module">
    import { createGpu, bounds, orbit, makeCamera, ray, pick, crosshair, standOn, box, merge, renderView, version, displayVersion } from '../src/index.js';
    import { LEG } from '../examples/table-model.js';

    const stage = document.getElementById('stage');
    const frame = document.getElementById('frame');
    const canvas = document.getElementById('gpu');
    const layer = document.getElementById('layer');
    const modeEl = document.getElementById('mode');
    const liveEl = document.getElementById('live');
    const yawEl = document.getElementById('yaw');
    const pitchEl = document.getElementById('pitch');
    const countEl = document.getElementById('count');
    const surfaceEl = document.getElementById('surface');
    document.getElementById('build').textContent = displayVersion(version);

    const HOME = { center: [0, 0.5, 0], radius: 1.6 }; // framing of an empty scene
    const fit = { ...HOME }; // follows the scene the MCP server sends
    const nothing = { positions: [], faces: [] };
    const START = { yaw: -0.6, pitch: 0.45 };
    const LIMIT = Math.PI / 2;
    const STEP = 0.12;

    let yaw = START.yaw;
    let pitch = START.pitch;
    let pointer = null; // last pointer position, client pixels
    let hit = null; // the surface under the pointer in the last drawn frame
    let queued = false;

    // Prisms put down so far: { mesh, from, start }. `from` is the start offset of a
    // flight that ends at the mesh's own position; null once it has landed.
    const placed = [];
    const FLIGHT_MS = 650;
    const SHOT_MAX = 6.4; // farthest shot, in eye-to-center distances
    const UP = [0, 1, 0];

    // A random wood brown, as #rrggbb.
    const brown = () => {
      const h = 18 + Math.random() * 16;
      const sat = (30 + Math.random() * 25) / 100;
      const l = (24 + Math.random() * 24) / 100;
      const a = sat * Math.min(l, 1 - l);
      const f = (n) => {
        const k = (n + h / 30) % 12;
        const c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
        return Math.round(c * 255).toString(16).padStart(2, '0');
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    };
    let remote = nothing; // the scene pushed by the MCP server (read-only here)
    let scene = nothing; // what picking sees: the remote scene and the landed prisms
    let cam = null; // camera of the last drawn frame
    const rebuild = () => {
      scene = merge(remote, ...placed.filter((p) => !p.from).map((p) => p.mesh));
    };
    const shifted = (mesh, d) => ({ ...mesh, positions: mesh.positions.map((q) => [q[0] + d[0], q[1] + d[1], q[2] + d[2]]) });
    const flying = (p, now) => {
      if (!p.from) return p.mesh;
      const t = Math.min(1, (now - p.start) / FLIGHT_MS);
      if (t >= 1) {
        p.from = null;
        return p.mesh;
      }
      const k = (1 - t) ** 3; // ease out: fast at the start, settles softly
      return shifted(p.mesh, p.from.map((c) => c * k));
    };

    const deg = (r) => `${Math.round((r * 180) / Math.PI)}°`;
    const signed = (n) => {
      const v = Math.round(n * 100) / 100 + 0;
      return `${v < 0 ? '−' : '+'}${Math.abs(v).toFixed(2)}`;
    };

    // Travel: the camera glides to a target (what to look at, how close, from which side).
    // The view is an orbit around fit.center, so travelling means easing center, radius, yaw and pitch.
    let travel = null;
    let focused = false; // true while the camera sits on one object; scene updates then leave it alone
    const TRAVEL_MS = 900;
    const ease = (t) => (t < 0.5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2);
    const turnBy = (a, b) => a + ((((b - a) % (2 * Math.PI)) + 3 * Math.PI) % (2 * Math.PI)) - Math.PI; // a -> b the short way round
    const goTo = (to) => {
      travel = {
        start: performance.now(),
        from: { center: [...fit.center], radius: fit.radius, yaw, pitch },
        to: { ...to, yaw: turnBy(yaw, to.yaw ?? yaw), pitch: to.pitch ?? pitch },
      };
      redraw();
    };
    const stepTravel = (now) => {
      if (!travel) return;
      const t = Math.min(1, (now - travel.start) / TRAVEL_MS);
      const k = ease(t);
      const { from, to } = travel;
      const mix = (a, b) => a + (b - a) * k;
      fit.center = from.center.map((c, i) => mix(c, to.center[i]));
      fit.radius = mix(from.radius, to.radius);
      yaw = mix(from.yaw, to.yaw);
      pitch = mix(from.pitch, to.pitch);
      if (t >= 1) travel = null;
      else redraw();
    };

    // All faces connected to `face` through shared vertices: one object of the scene.
    const objectAround = (mesh, face) => {
      const at = new Map();
      mesh.faces.forEach((f, i) => f.v.forEach((v) => (at.get(v) ?? at.set(v, []).get(v)).push(i)));
      const seen = new Set([face]);
      const todo = [face];
      while (todo.length) {
        for (const v of mesh.faces[todo.pop()].v) {
          for (const j of at.get(v)) if (!seen.has(j)) (seen.add(j), todo.push(j));
        }
      }
      const used = new Set();
      for (const i of seen) mesh.faces[i].v.forEach((v) => used.add(v));
      return { positions: [...used].map((v) => mesh.positions[v]), faces: [] };
    };

    // The framing that shows the whole remote scene (or the empty-scene home).
    const overview = () => {
      if (!remote.positions.length) return { ...HOME, center: [...HOME.center] };
      const b = bounds(remote);
      return { center: b.center, radius: Math.max(b.radius * 1.05, 0.25) };
    };

    // T: fly in front of the object under the cross; with nothing under it, fly back out.
    const travelTo = () => {
      if (hit) {
        const b = bounds(objectAround(scene, hit.face));
        const [nx, ny, nz] = hit.normal;
        focused = true;
        goTo({
          center: b.center,
          radius: Math.max(b.radius * 1.15, 0.12),
          yaw: Math.atan2(-nx, nz), // the eye ends up on the side the pointed surface faces
          pitch: Math.max(0.3, Math.min(1.1, Math.asin(Math.max(-1, Math.min(1, ny))))),
        });
      } else {
        focused = false;
        goTo({ ...overview(), yaw: START.yaw, pitch: START.pitch });
      }
    };

    const fabMode = document.getElementById('fabMode');
    const draw = () => {
      queued = false;
      stepTravel(performance.now());
      const r = stage.getBoundingClientRect();
      const touchy = matchMedia('(pointer: coarse), (max-width: 640px)').matches;
      // on a phone the drawing is a little larger than the short side and the rest of the screen is panel color
      const size = Math.max(160, Math.min(900, Math.floor(Math.min(r.width, r.height) * (touchy ? 1.12 : 1))));
      if (!pointer && touchy) pointer = { x: r.left + r.width / 2, y: r.top + r.height / 2 }; // no mouse: aim at the middle
      const view = orbit({ yaw, pitch }); // the camera orbits, the scene stays in object space

      const now = performance.now();
      const shown = merge(remote, ...placed.map((p) => flying(p, now)));
      if (placed.some((p) => p.from)) redraw();
      else rebuild();

      hit = null;
      if (pointer) {
        // the square panel is centered in the stage
        const x = pointer.x - r.left - (r.width - size) / 2;
        const y = pointer.y - r.top - (r.height - size) / 2;
        cam = makeCamera(view, scene, size, fit);
        hit = pick(scene, cam, x, y);
        cam.at = { x, y };
      }
      const marks = hit ? [{ name: 'cursor', lines: crosshair(scene, hit, fit.radius * 0.07) }] : [];

      frame.style.width = frame.style.height = `${size}px`;
      if (mode === 'gpu' && gpu) {
        canvas.style.width = canvas.style.height = `${size}px`;
        const bg = getComputedStyle(document.documentElement).getPropertyValue('--panel').trim();
        const rgb = /^#[0-9a-f]{6}$/i.test(bg) ? [1, 3, 5].map((i) => parseInt(bg.slice(i, i + 2), 16) / 255) : undefined;
        const a = lightAngle;
        renderGpu = (readback = false) =>
          gpu[readback ? 'pixels' : 'render'](shown, view, {
            size,
            fit,
            background: rgb,
            light: { direction: [Math.sin(a) * 0.6, 0.8, Math.cos(a) * 0.6] },
          });
        renderGpu();
        layer.className = 'over';
        layer.innerHTML = renderView(nothing, view, { size, fit, marks });
      } else {
        layer.className = '';
        layer.innerHTML = renderView(shown, view, { size, fit, marks });
      }
      fabMode.classList.toggle('on', mode === 'gpu' && Boolean(gpu));
      yawEl.textContent = deg(yaw);
      pitchEl.textContent = deg(pitch);
      countEl.textContent = String(placed.length);
      surfaceEl.innerHTML = hit
        ? `surface <b>face ${hit.face} · n ${hit.normal.map(signed).join(' ')}</b>`
        : 'surface <b>–</b>';
    };
    // SVG is the default view; WebGPU is set up on first use and falls back to SVG if it fails.
    let mode = 'svg';
    let gpu = null;
    let lightAngle = 0.8;
    let renderGpu = null;
    const setMode = async (next) => {
      if (next === 'gpu' && !gpu) {
        try {
          const g = await createGpu(canvas);
          gpu = g;
          // a lost device (driver reset, GPU process crash) drops back to the SVG view
          g.device.lost.then((info) => {
            if (gpu !== g) return;
            gpu = null;
            mode = 'svg';
            canvas.hidden = true;
            stage.classList.remove('gpu');
            modeEl.textContent = 'svg (webgpu lost)';
            modeEl.title = String(info.message ?? info.reason);
            redraw();
          });
        } catch (err) {
          modeEl.textContent = 'svg (webgpu unavailable)';
          modeEl.title = String(err.message ?? err);
          return;
        }
      }
      mode = next;
      canvas.hidden = mode !== 'gpu';
      stage.classList.toggle('gpu', mode === 'gpu');
      modeEl.textContent = mode === 'gpu' ? 'webgpu' : 'svg';
      modeEl.title = '';
      redraw();
    };
    const toggleMode = () => setMode(mode === 'gpu' ? 'svg' : 'gpu');
    const turnLight = () => {
      lightAngle += Math.PI / 4;
      redraw();
    };
    const redraw = () => {
      if (!queued) {
        queued = true;
        requestAnimationFrame(draw);
      }
    };
    const turn = (dYaw, dPitch) => {
      travel = null; // the hand takes over from the glide
      yaw += dYaw;
      pitch = Math.max(-LIMIT, Math.min(LIMIT, pitch + dPitch));
      redraw();
    };
    const reset = () => {
      focused = false;
      goTo({ ...overview(), yaw: START.yaw, pitch: START.pitch });
    };

    // A prism like the old table leg (same base), three times as tall as it is wide,
    // standing on the surface under the cross.
    const place = () => {
      if (hit) {
        placed.push({ mesh: standOn(scene, hit, { base: LEG.base, color: brown() }), from: null });
        rebuild();
        return redraw();
      }
      if (!pointer || !cam?.at) return;
      // Empty space under the cursor: shoot the prism out along the cursor ray,
      // to a random distance, and let it fly there.
      const { origin, dir } = ray(cam, cam.at.x, cam.at.y);
      const D = Math.hypot(...origin.map((c, i) => c - fit.center[i])); // eye to scene center
      const reach = (k) => origin.map((c, i) => c + dir[i] * D * k);
      const k = 0.6 + Math.random() * (SHOT_MAX - 0.6);
      const end = reach(k); // lands under the cursor, on the cursor ray
      // Flies exactly along the camera axis, so on screen it stays under the cursor and only grows or shrinks.
      const f = cam.f;
      const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
      // Lying like a bullet: the long axis is the camera axis.
      const mesh = box({ size: [LEG.base, 3 * LEG.base, LEG.base], at: end, color: brown(), axes: [cam.u, f, cross(cam.u, f)] });
      const back = (k - 0.2) * D * (dir[0] * f[0] + dir[1] * f[1] + dir[2] * f[2]); // distance along the axis to the start depth
      placed.push({ mesh, from: f.map((c) => -c * back), start: performance.now() });
      redraw();
    };
    // Which landed prism owns a face of the pick scene .
    const owner = (face) => {
      let o = remote.faces.length; // the remote scene's faces come first and are not deletable
      if (face < o) return null;
      for (const p of placed) {
        if (p.from) continue;
        o += p.mesh.faces.length;
        if (face < o) return p;
      }
      return null;
    };
    const remove = () => {
      const p = hit && owner(hit.face);
      if (!p) return;
      placed.splice(placed.indexOf(p), 1);
      rebuild();
      redraw();
    };
    const undo = () => {
      if (!placed.length) return;
      placed.pop();
      rebuild();
      redraw();
    };

    let last = null; // drag origin
    stage.addEventListener('pointerdown', (e) => {
      last = { x: e.clientX, y: e.clientY };
      pointer = { x: e.clientX, y: e.clientY };
      stage.setPointerCapture(e.pointerId);
      stage.classList.add('drag');
      redraw();
    });
    stage.addEventListener('pointermove', (e) => {
      pointer = { x: e.clientX, y: e.clientY };
      if (!last) return redraw();
      turn((e.clientX - last.x) * 0.008, (e.clientY - last.y) * 0.008);
      last = { x: e.clientX, y: e.clientY };
    });
    const release = () => {
      last = null;
      stage.classList.remove('drag');
    };
    stage.addEventListener('pointerup', release);
    stage.addEventListener('pointercancel', release);
    stage.addEventListener('pointerleave', (e) => {
      if (last || e.pointerType === 'touch') return; // a finger leaves the screen: the cross stays where it was
      pointer = null;
      redraw();
    });
    stage.addEventListener('dblclick', reset);

    const moves = {
      ArrowLeft: [-STEP, 0],
      ArrowRight: [STEP, 0],
      ArrowUp: [0, -STEP],
      ArrowDown: [0, STEP],
    };
    document.addEventListener('keydown', (e) => {
      if (e.target instanceof HTMLButtonElement) return; // Space and Enter belong to a focused button
      if (e.key === ' ') {
        e.preventDefault();
        if (!e.repeat) place();
      } else if (e.key === 'd' || e.key === 'D' || e.key === 'Delete') {
        e.preventDefault();
        remove();
      } else if (e.key === 'g' || e.key === 'G') {
        e.preventDefault();
        toggleMode();
      } else if (e.key === 'l' || e.key === 'L') {
        e.preventDefault();
        turnLight();
      } else if (e.key === 't' || e.key === 'T') {
        e.preventDefault();
        if (!e.repeat) travelTo();
      } else if (e.key === 'h' || e.key === 'H') {
        e.preventDefault();
        stage.classList.toggle('clean');
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        undo();
      } else if (moves[e.key]) {
        e.preventDefault();
        turn(...moves[e.key]);
      }
    });
    document.getElementById('place').addEventListener('click', place);
    document.getElementById('delete').addEventListener('click', remove);
    document.getElementById('travel').addEventListener('click', travelTo);
    document.getElementById('fabTravel').addEventListener('click', travelTo);
    document.getElementById('fabPlace').addEventListener('click', place);
    document.getElementById('fabDelete').addEventListener('click', remove);
    document.getElementById('fabMode').addEventListener('click', toggleMode);
    document.getElementById('lines').addEventListener('click', () => stage.classList.toggle('clean'));
    document.getElementById('gpuBtn').addEventListener('click', toggleMode);
    document.getElementById('light').addEventListener('click', turnLight);
    document.getElementById('undo').addEventListener('click', undo);
    document.getElementById('reset').addEventListener('click', reset);
    new ResizeObserver(redraw).observe(stage);

    // ?debug: read the WebGPU frame back through an offscreen texture (a headless browser shows no canvas)
    if (new URLSearchParams(location.search).has('debug')) {
      globalThis.__3draft = {
        grab: async () => {
          const r = await renderGpu(true);
          const o = document.createElement('canvas');
          o.width = r.width;
          o.height = r.height;
          o.getContext('2d').putImageData(new ImageData(r.data, r.width, r.height), 0, 0);
          return o.toDataURL('image/png');
        },
      };
    }

    // Live link: when served by the MCP server (`/events` exists), show what the AI builds.
    const applyScene = (data) => {
      const meshes = (data.objects ?? []).map((o) => o.mesh);
      remote = merge(nothing, ...meshes);
      rebuild();
      if (!focused) Object.assign(fit, overview()); // a camera parked on an object stays there

      liveEl.textContent = `${meshes.length} object${meshes.length === 1 ? '' : 's'} · rev ${data.rev}`;
      redraw();
    };
    if (['localhost', '127.0.0.1'].includes(location.hostname) && typeof EventSource !== 'undefined') {
      const events = new EventSource('/events');
      events.addEventListener('scene', (e) => {
        try {
          applyScene(JSON.parse(e.data));
        } catch (err) {
          liveEl.textContent = 'bad scene';
          liveEl.title = String(err.message ?? err);
        }
      });
      events.onerror = () => {
        liveEl.textContent = events.readyState === EventSource.CLOSED ? 'off' : 'reconnecting…';
      };
    }

    draw();
  </script>
</body>
</html>
