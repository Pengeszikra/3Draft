<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun shader</title>
<style>html,body{margin:0;height:100%;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// A burning sun without any texture: one quad, one fragment shader.
//  - the surface is fractal noise on the sphere, drifting slowly (granulation, hot and cooler patches)
//  - the rim is brighter in a thin glow, then fades out (corona)
//  - flares are the same noise bent by the angle round the disk, so they lick out from the rim
const vs = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const fs = `#version 300 es
precision highp float;
uniform vec2 res; uniform float time; uniform vec3 tint;
out vec4 o;
float h(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float n(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3. - 2. * f);
  return mix(mix(mix(h(i), h(i + vec3(1,0,0)), f.x), mix(h(i + vec3(0,1,0)), h(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h(i + vec3(0,0,1)), h(i + vec3(1,0,1)), f.x), mix(h(i + vec3(0,1,1)), h(i + vec3(1,1,1)), f.x), f.y), f.z); }
float fbm(vec3 x){ float a = .5, s = 0.; for (int k = 0; k < 6; k++){ s += a * n(x); x = x * 2.03 + 11.7; a *= .5; } return s; }
void main(){
  vec2 q = (gl_FragCoord.xy - .5 * res) / (.5 * min(res.x, res.y)); // the sun's disk has radius .55
  float R = .55, r = length(q) / R;
  vec3 col = vec3(0.);
  float t = time * .05;
  if (r < 1.){
    float z = sqrt(1. - r * r);
    vec3 N = vec3(q / R, z);
    float c = cos(t), s = sin(t);
    vec3 P = vec3(c * N.x + s * N.z, N.y, -s * N.x + c * N.z); // slow spin
    float g = fbm(P * 5. + vec3(0., 0., t * 3.));
    float g2 = fbm(P * 14. - t * 4.);
    float heat = clamp(.45 + (g - .45) * 1.5 + (g2 - .5) * .9, 0., 1.4);
    col = mix(vec3(.78, .38, .08), vec3(1., .86, .52), smoothstep(.1, 1.1, heat)) * tint;
    col *= .55 + .5 * pow(z, .35);                // a touch darker toward the limb
    col += vec3(1., .68, .25) * pow(1. - z, 2.5) * .8; // and a bright thin rim
  }
  // glow and flares outside the disk
  float d = max(r - 1., 0.);
  float ang = atan(q.y, q.x);
  float fl = fbm(vec3(cos(ang) * 2.2, sin(ang) * 2.2, time * .12 - d * 1.5));
  float flare = smoothstep(.35, .9, fl) * exp(-d * 6.5);
  float glow = exp(-d * 3.4) * .6 + exp(-d * 12.) * .9;
  vec3 halo = vec3(1., .62, .18) * (glow + flare * 1.4) * tint;
  col = r < 1. ? col + halo * .25 * smoothstep(.9, 1., r) : halo;
  col = 1. - exp(-col * 1.35); // soft tone map
  o = vec4(pow(col, vec3(.9)), 1.);
}`;
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2');
const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const u = (n) => gl.getUniformLocation(prog, n);
// the star colour follows its temperature: ?k=3500 (red dwarf) ... 5800 (the Sun) ... 10000 (blue-white)
const K = Number(new URLSearchParams(location.search).get('k')) || 5800;
const warm = (k) => { const t = Math.max(0, Math.min(1, (k - 3000) / 7000)); return [0.9 + 0.1 * (1 - t) * 0 + (1 - t) * 0.1 - t * 0.25, 0.72 + t * 0.2, 0.45 + t * 0.55]; };
const tint = warm(K);
const draw = (ms) => {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = Math.floor(innerWidth * dpr), h = Math.floor(innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
  gl.uniform2f(u('res'), w, h);
  gl.uniform1f(u('time'), (window.__t ?? ms / 1000));
  gl.uniform3f(u('tint'), ...tint);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(draw);
};
requestAnimationFrame(draw);
</script>
</body>
</html>
